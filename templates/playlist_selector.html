<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select playlist</title>
</head>
<body>
{% if header %}
    <h2>{{ header }}</h2>
{% else %}
    <h2>Select playlist</h2>
{% endif %}
<ul>
    {% for playlist in playlists %}
        <li>
            <a href="{{ callback }}playlist_id={{ playlist.id }}">{{ playlist.name }} (owner: {{ playlist.owner }})</a>
        </li>
    {% endfor %}
</ul>
</body>
</html>
