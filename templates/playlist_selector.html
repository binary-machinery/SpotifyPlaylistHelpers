<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select playlist</title>
</head>
<body>
<h2>Select playlist</h2>
<ul>
    {% for playlist in playlists %}
        <li><a href="{{ callback }}?id={{ playlist.id }}">{{ playlist.name }} (owner: {{ playlist.owner }})</a></li>
    {% endfor %}
</ul>
</body>
</html>
