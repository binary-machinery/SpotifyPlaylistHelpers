services:
  spotify-playlist-helpers:
    image: 000000000000.dkr.ecr.us-east-1.amazonaws.com/spotify-playlist-helpers:latest
    volumes:
      - ./configs/config.json:/app/configs/config.json:ro

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - spotify-playlist-helpers
